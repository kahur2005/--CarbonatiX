[project]
name = "carbonatix-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-jose[cryptography]>=3.3",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "anthropic>=0.40",
    "prophet>=1.1.6",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
