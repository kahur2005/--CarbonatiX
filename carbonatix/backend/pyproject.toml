[project]
name = "carbonatix-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-jose[cryptography]>=3.3",
    "asyncpg>=0.30",
    "httpx>=0.27",
    # The advisor reaches its model (GPT-5.6 Sol, previously Claude Fable 5)
    # through Elice ML API, an OpenAI-compatible gateway, so it uses the
    # OpenAI SDK against a custom base URL. `anthropic` stays only for
    # app/ingestion/vision.py, which is due to move to a separate
    # document-vision provider.
    "openai>=1.60",
    "anthropic>=0.40",
    "prophet>=1.1.6",
    "pandas>=2.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(fn)` -- the call
# is evaluated once per request by FastAPI's own machinery, not at import
# time, so B008's "function call in default argument" warning is a false
# positive here. Ruff's built-in exemption for this pattern only fires when
# the parameter is annotated with a handful of builtin scalar types; every
# protected route in this project annotates its user id as `UUID`, which
# falls outside that heuristic, so it must be listed explicitly.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.File", "fastapi.Form"]
